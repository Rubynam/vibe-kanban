services:
  vibe-kanban:
    build:
      context: .
      dockerfile: Dockerfile
    image: vibe-kanban:local
    container_name: vibe-kanban
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      # Pin the preview proxy (default is a random port) so it can be published
      PREVIEW_PROXY_PORT: 3001
      # Cloud API for sign-in/orgs. The image bakes in "" at build time; runtime env wins.
      VK_SHARED_API_BASE: https://api.vibekanban.com
      # Local username/password sign-in (feat/local-auth). Needed because the
      # cloud API above is set, which would otherwise keep it off.
      VK_LOCAL_AUTH: "true"
      # ProjectDirs respects XDG on Linux -> keep DB/config/cache in the mounted dir
      XDG_DATA_HOME: /data/share
      XDG_CACHE_HOME: /data/cache
      # Workspace: the host folder with your projects is mounted at /workspace.
      # Set HOST_WORKSPACE in .env (absolute path), e.g.
      #   HOST_WORKSPACE=/Users/me/Desktop/workspace
      # The repo picker opens at /workspace, and host paths you paste
      # (/Users/me/Desktop/workspace/app) are translated to /workspace/app.
      VK_WORKSPACE_DIR: /workspace
      VK_HOST_WORKSPACE_DIR: ${HOST_WORKSPACE:-}
    ports:
      # Published on all host interfaces (outside the docker network)
      - "0.0.0.0:3000:3000"
      - "0.0.0.0:3001:3001"
    volumes:
      - ./data:/data
      - ./data/repos:/repos
      - ${HOST_WORKSPACE:-./data/workspace}:/workspace
